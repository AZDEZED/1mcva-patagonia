</style></head><body><main class="viewport"><section class="deck" aria-label="Diaporama"><div class="back"></div><div class="veil"></div><div class="content" id="content"></div></section></main><nav class="controls" aria-label="Commandes"><button id="prev" title="Précédent">←</button><select id="jump" aria-label="Sommaire"></select><button id="next" title="Suivant">→</button><button id="correct" class="primary">Correction</button><button id="answerNext" class="primary" hidden>Suite</button><span class="clock" id="clock"></span><button id="timer">▶ Temps</button><button id="reset" class="optional">Réinitialiser</button><button id="resources">Fiches PDF</button><button id="notes">Notes (N)</button><button id="videos" title="Liens YouTube de la séance (V)">Vidéos (V)</button><button id="full">Plein écran</button><button id="help" class="optional">Aide</button><div class="progress" id="progress"></div></nav><aside class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialogbox"><button id="close">Fermer</button><h2 id="dialogTitle"></h2><div id="dialogBody"></div></div></aside><script>
const data={"slides": [{"title": "Bienvenue dans votre atelier de vente", "block": "H1-A", "ref": "Dossier déjà réalisé", "body": "<p class=\"eyebrow\">Patagonia<\/p><p class=\"hero\">Des réponses écrites<br/>à l’entretien de vente<\/p><p class=\"intro\">Aujourd’hui, vous vous entraînez.<br/>Vous pouvez essayer, vous corriger et rejouer.<\/p>", "task": "Sortez le dossier de dix faces et votre stylo.", "notes": "Je vérifie les présences et organise environ cinq triades. Les deux premières heures se suivent, la troisième vient après la coupure. Chaque heure comporte 55 min de travail + 5 min de marge.", "answers": [], "kind": "cover"}, {"title": "Votre repère de formation", "block": "H1-A", "ref": "Ancien dossier, face 1", "body": "<p class=\"big\">Bloc 1 : Conseiller et vendre<\/p><ol class=\"steps\"><li>Découvrir les besoins, motivations et freins.<\/li><li>Reformuler et conseiller une solution adaptée.<\/li><li>Argumenter et répondre aux objections.<\/li><\/ol><p class=\"explain\">Compétence : Réaliser la vente dans un cadre omnicanal.<br/>Préparation à E31 / U31 « Vente-conseil ».<\/p>", "task": "Nommez une compétence que vous avez déjà travaillée.", "notes": "Référentiel fourni, bloc 1. CAP et SONCASE sont des outils, pas des blocs. Cette simulation en magasin travaille une partie de la compétence, pas toute la vente omnicanale. Séance formative. Périmètre A.Zeboudj : découverte, argumentation, objections. Pas de calcul tarifaire du périmètre Mechria.", "answers": [], "kind": ""}, {"title": "Les trois heures de travail", "block": "H1-A", "ref": "Kit et dossier déjà réalisé", "body": "<div class=\"columns\"><div><h3>Heure 1<\/h3><p>Correction ciblée, observation et exemple guidé.<\/p><\/div><div><h3>Heure 2<\/h3><p>Trois situations. Vous passez vendeur dans chaque situation.<\/p><\/div><div><h3>Après la coupure<\/h3><p>Un entretien final, puis votre bilan individuel.<\/p><\/div><\/div><p class=\"note\">Deux règles : les faits viennent de la fiche produit. Le client reste libre de décider.<\/p>", "task": "Écrivez A, B ou C à côté de votre prénom selon votre place dans le trio.", "notes": "J’attribue les lettres et conserve les mêmes triades. Si effectif non multiple de 3 : un duo alterne et je l’observe, ou un quatuor avec deux observateurs qui confrontent leurs preuves. Aucun élève ne reste spectateur toute l’heure.", "answers": [], "kind": ""}, {"title": "Votre point de départ", "block": "H1-B", "ref": "Ancien dossier, faces 2, 6 et 8 à 10", "body": "<ol class=\"steps\"><li>Relisez une réponse sur les notions, un CAP et une objection.<\/li><li>Entourez une réussite. Marquez une phrase à améliorer.<\/li><li>Préparez une question précise sur votre travail.<\/li><\/ol>", "task": "Travail individuel : 3 minutes, sans échange.", "notes": "Bloc correction 12 min : 3 min relecture, 4 min notions, 5 min CAP et objection. Je ne corrige pas les dix faces intégralement. Je fais écrire les améliorations avec une autre couleur. Aucune statistique inventée sur le groupe.", "answers": [], "kind": ""}, {"title": "Besoin, motivation, frein et objection", "block": "H1-B", "ref": "Ancien dossier, face 2", "body": "<blockquote>« Je marche sous la pluie. Je veux être certain de rester protégé. Avant de choisir, j’ai peur d’un achat inutile. Après la présentation : ce modèle est trop cher. »<\/blockquote><p class=\"intro\">Classez les quatre passages. Justifiez avec un indice.<\/p>", "task": "Comparez avec vos réponses de la face 2.", "notes": "Les mots ne suffisent pas seuls. Une objection exprime une réserve sur l’offre et peut révéler un frein. Accepter les formulations équivalentes. Ne pas forcer une seule catégorie sur une phrase comprenant plusieurs informations.", "answers": [["Les quatre notions", "<table><tr><th>Passage<\/th><th>Notion<\/th><th>Pourquoi ?<\/th><\/tr><tr><td>Marcher sous la pluie<\/td><td>Besoin<\/td><td>Usage à satisfaire : se protéger.<\/td><\/tr><tr><td>Être certain de rester protégé<\/td><td>Motivation<\/td><td>Raison du choix : Sécurité.<\/td><\/tr><tr><td>Peur d’un achat inutile avant le choix<\/td><td>Frein<\/td><td>Un doute gêne la décision.<\/td><\/tr><tr><td>Ce modèle est trop cher<\/td><td>Objection<\/td><td>Réserve exprimée sur l’offre.<\/td><\/tr><\/table><p class=\"note\">L’objection peut exprimer un frein financier. Une même phrase peut contenir plusieurs indices.<\/p>"], ["Votre exercice de la face 2", "<p class=\"big\">A : 1 Besoin, 2 Motivation, 3 Frein, 4 Objection.<\/p><p class=\"intro\">B : se protéger pendant vingt minutes de marche sous la pluie. Motivation Environnement, justifiée par « matière recyclée ».<\/p>"]], "kind": ""}, {"title": "Un CAP corrigé avec précision", "block": "H1-B", "ref": "Ancien dossier, faces 5 et 6", "body": "<blockquote>« Elle est de bonne qualité, donc elle est parfaite pour vous. Patagonia est connue. »<\/blockquote><p class=\"intro\">Quel fait manque ? Quel bénéfice faudrait-il expliquer ? Quelle preuve vérifier ?<\/p>", "task": "Soulignez C, entourez A et encadrez P dans votre CAP.", "notes": "Je ne valorise pas la notoriété comme preuve de la propriété avancée. C produit et A client doivent être distincts. Le métier du client n’est pas C. Une preuve peut citer la fiche qui confirme la caractéristique.", "answers": [["Le repérage de la face 5", "<p class=\"big\">1 = A : ajuster la capuche à votre tête.<br/>2 = P : fiche du modèle et repère F3.<br/>3 = C : capuche réglable en deux points.<\/p>"], ["Le CAP guidé de la face 6", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Construction imperméable à trois couches.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Une protection contre la pluie pour vos trajets à pied.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La fiche du modèle 85241, repère F1, décrit cette construction selon H2No.<\/p><\/div><\/div><p class=\"explain\">Sécurité : « être rassuré sur la protection ». Le choix F1 répond au besoin de pluie. Les poches ne constituent pas l’argument principal ici.<\/p>"], ["Une phrase possible", "<blockquote>« Cette veste possède une construction imperméable à trois couches. Elle vous apporte une protection contre la pluie pendant vos trajets à pied. La fiche du modèle 85241 confirme cette construction en F1. »<\/blockquote><p class=\"note\">Le nom du document et son repère rendent la preuve vérifiable.<\/p>"]], "kind": ""}, {"title": "SONCASE : les sept motivations", "block": "H1-C", "ref": "Fiche ressource R1, recto", "body": "<table><tr><th>Lettre<\/th><th>Signification<\/th><th>Indice possible<\/th><\/tr><tr><td>S<\/td><td>Sécurité<\/td><td>Être rassuré, limiter un risque.<\/td><\/tr><tr><td>O<\/td><td>Orgueil<\/td><td>Se distinguer, valoriser son image.<\/td><\/tr><tr><td>N<\/td><td>Nouveauté<\/td><td>Découvrir un produit ou une conception différente.<\/td><\/tr><tr><td>C<\/td><td>Confort<\/td><td>Faciliter l’usage, réduire une gêne.<\/td><\/tr><tr><td>A<\/td><td>Argent<\/td><td>Maîtriser sa dépense, comparer valeur et prix.<\/td><\/tr><tr><td>S<\/td><td>Sympathie<\/td><td>Apprécier l’écoute et la relation avec le vendeur.<\/td><\/tr><tr><td>E<\/td><td>Environnement<\/td><td>Tenir compte des matières et de l’impact.<\/td><\/tr><\/table>", "task": "Repérez une motivation dans les paroles du client, pas dans son âge ou son métier.", "notes": "4 min pour les slides 7 et 8. Rappeler toutes les lettres. Environnement ou Écologie sont des appellations courantes, garder Environnement dans le kit. Le premier S est Sécurité, le second Sympathie.", "answers": [["Votre exercice de la face 3", "<p class=\"big\">1 Argent, 2 Confort, 3 Sympathie, 4 Environnement, 5 Orgueil, 6 Nouveauté.<\/p><p class=\"explain\">Nouveauté : « découvrir un système différent ». Sympathie : confiance liée à l’écoute du vendeur. Les indices priment sur le seul mot « confiance ».<\/p>"]], "kind": ""}, {"title": "CAP : les trois rôles", "block": "H1-C", "ref": "Fiche ressource R1, recto", "body": "<div class=\"columns\"><div><h3>C : Caractéristique<\/h3><p>Un fait précis sur le produit.<\/p><\/div><div><h3>A : Avantage<\/h3><p>Ce que ce fait apporte à ce client.<\/p><\/div><div><h3>P : Preuve<\/h3><p>Un élément vérifiable qui étaye l’argument.<\/p><\/div><\/div><blockquote>« J’ai trop chaud quand je marche vite. »<\/blockquote><div class=\"cap compact\"><div class=\"c\"><b>C<\/b><p>Zips sous les bras.<\/p><\/div><div class=\"a\"><b>A<\/b><p>Ajuster l’aération en marchant.<\/p><\/div><div class=\"p\"><b>P<\/b><p>Fiche 85241, F4.<\/p><\/div><\/div>", "task": "Dites pourquoi ce CAP correspond au Confort.", "notes": "La preuve renvoie à la fiche réelle, pas à un avis inventé. L’avantage est une possibilité d’ajuster l’aération, pas une garantie de ne jamais avoir chaud.", "answers": [], "kind": ""}, {"title": "La mission d’observation vidéo", "block": "H1-D", "ref": "Sur une feuille ou au dos du dossier", "body": "<ol class=\"steps\"><li>Notez deux paroles ou gestes précis du vendeur.<\/li><li>Repérez une question de découverte, ou son absence.<\/li><li>Proposez une meilleure phrase.<\/li><\/ol><p class=\"note\">Nous analysons des comportements, sans nous moquer de la personne.<\/p>", "task": "Préparez trois lignes de notes avant le visionnage.", "notes": "12 min pour les slides 9 à 13. Viser deux extraits de 2 min maximum : 4 min vidéo, 3 min écrit, 5 min échange. Les vidéos CIFCA sont des ressources repérées, leur lecture n’a pas pu être vérifiée ici. Tester avant le cours. Si durée inadéquate ou lien bloqué : utiliser les dialogues de secours. Ne pas attribuer des comportements à la vidéo sans observation effective.", "answers": [], "kind": ""}, {"title": "Le contre-exemple", "block": "H1-D", "ref": "Observation 1", "body": "<blockquote>« Le vendeur cherche-t-il à comprendre avant de proposer ? »<\/blockquote><p class=\"intro\"><a class=\"video\" href=\"https://www.youtube.com/watch?v=iNln8II5wOY\" target=\"_blank\" rel=\"noopener\">Ouvrir « Le mauvais vendeur »<\/a><\/p><p class=\"explain\">CFA du CIFCA, produits biologiques.<br/>Un extrait de 2 minutes maximum.<\/p>", "task": "Notez les paroles exactes qui vous permettent de juger.", "notes": "Ne pas laisser défiler jusqu’à la fin si l’extrait dépasse le budget. Les réponses de l’analyse sont des critères, pas une transcription vérifiée de la vidéo. Alternative : lire le dialogue original de secours.", "answers": [["Dialogue de secours, contre-exemple", "<blockquote>« Client : Je voudrais une veste de pluie, mais 200 €, c’est beaucoup. »<\/blockquote><blockquote>« Vendeur : C’est le prix de la qualité. Elle est entièrement recyclée et se répare forcément. Vous la prenez ? »<\/blockquote><p class=\"explain\">Dialogue pédagogique fictif. Quelles affirmations et étapes posent problème ?<\/p>"]], "kind": ""}, {"title": "L’analyse du contre-exemple", "block": "H1-D", "ref": "Observation 1", "body": "<p class=\"big\">Quel indice permet de justifier votre jugement ?<\/p><ol class=\"steps\"><li>La réponse arrive-t-elle avant une question ?<\/li><li>Le bénéfice correspond-il au besoin exprimé ?<\/li><li>Les affirmations peuvent-elles se vérifier ?<\/li><li>Le client peut-il encore hésiter ?<\/li><\/ol>", "task": "Une erreur repérée, une phrase améliorée.", "notes": "Je demande : « Qu’avez-vous réellement entendu ? ». Pour la vidéo, compléter seulement avec observations effectives. Le corrigé détaillé ci-dessous porte sur le dialogue fictif de secours.", "answers": [["Correction du dialogue de secours", "<p class=\"intro\">Absences : reformulation, question de découverte et vérification du doute.<\/p><p class=\"intro\">« Entièrement recyclée » dépasse F2. « Se répare forcément » dépasse F7. « Le prix de la qualité » ne constitue pas un CAP.<\/p><blockquote>« Vous hésitez devant le prix. Qu’attendez-vous surtout de cette veste ? »<\/blockquote>"]], "kind": ""}, {"title": "Un entretien à observer", "block": "H1-D", "ref": "Observation 2", "body": "<p class=\"intro\"><a class=\"video\" href=\"https://www.youtube.com/watch?v=7l2u05x3QUM\" target=\"_blank\" rel=\"noopener\">Ouvrir « Le bon vendeur »<\/a><\/p><ol class=\"steps\"><li>Repérez une question réellement utile.<\/li><li>Notez une réponse du client réutilisée par le vendeur.<\/li><li>Retenez une formulation professionnelle.<\/li><\/ol>", "task": "Comparez les comportements observés aux cinq étapes.", "notes": "Même contrainte de 2 min. Le titre « bon vendeur » ne garantit pas que toutes nos étapes apparaissent dans le passage choisi. Une étape non visible reste « non observée ». Secours fictif disponible.", "answers": [["Dialogue de secours, exemple", "<blockquote>« Client : 200 €, c’est beaucoup. »<\/blockquote><blockquote>« Vendeur : Vous hésitez devant le prix. Qu’attendez-vous de cette veste pendant vos trajets ? »<\/blockquote><blockquote>« Client : Je peux envisager ce prix si elle me protège de la pluie à pied. »<\/blockquote><blockquote>« Vendeur : La construction imperméable à trois couches apporte une protection pour vos trajets. La fiche le confirme en F1. Cela répond-il à votre attente ? »<\/blockquote>"]], "kind": ""}, {"title": "Les comportements à retenir", "block": "H1-D", "ref": "Votre observation vidéo", "body": "<div class=\"columns\"><div><h3>Découvrir<\/h3><p>Laisser finir, reformuler, poser une question utile.<\/p><\/div><div><h3>Argumenter<\/h3><p>Choisir un bénéfice adapté et une preuve liée.<\/p><\/div><div><h3>Vérifier<\/h3><p>Demander si le doute est traité, respecter la décision.<\/p><\/div><\/div><p class=\"note\">Une réussite s’appuie sur une parole ou une action observée.<\/p>", "task": "Choisissez un comportement à réutiliser dans votre jeu de rôle.", "notes": "Correction des critères, pas liste de faits supposés vus dans les vidéos. Si l’extrait ne montre pas une étape, noter non observée, sans inventer. Pour le secours : prix reformulé, usage découvert, protection adaptée, F1 cité, vérification explicite.", "answers": [], "kind": ""}, {"title": "Le CAP en vidéo", "block": "H1-E", "ref": "Rappel ciblé", "body": "<p class=\"intro\"><a class=\"video\" href=\"https://www.youtube.com/watch?v=NLeYojG5U-I&t=108s\" target=\"_blank\" rel=\"noopener\">Ouvrir l’extrait CAP<\/a><\/p><p class=\"big\">De 1 min 48 à 3 min 58.<br/>Repérez le fait, le bénéfice et la preuve.<\/p>", "task": "Avant la fin, écrivez les trois lettres et leur rôle.", "notes": "4 min : 2 min 10 d’extrait + 1 min 50 d’analyse. Source : sommaire publié par Technique de Vente Edition. Ne pas projeter la vidéo complète ni son contenu promotionnel. L’extrait sur Environnement reste facultatif hors du temps principal. Secours : slide CAP et dialogue confort.", "answers": [["La transposition à notre produit", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Le tissu extérieur est en nylon ECONYL 100 % recyclé.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Ce choix correspond à votre recherche de matière recyclée pour cette partie du vêtement.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La rubrique Matières de la fiche 85241 précise cette composition, F2.<\/p><\/div><\/div><p class=\"note\">Environnement : le client privilégie les matières recyclées. Le pourcentage porte sur le tissu extérieur.<\/p>"]], "kind": ""}, {"title": "Les cinq étapes de la réponse", "block": "H1-F", "ref": "R1 recto, ancien dossier face 7", "body": "<ol class=\"steps\"><li>Écouter la déclaration jusqu’au bout.<\/li><li>Reformuler le doute avec fidélité.<\/li><li>Questionner, puis écouter la précision.<\/li><li>Répondre par un CAP adapté à SONCASE.<\/li><li>Vérifier si la réponse traite le doute.<\/li><\/ol>", "task": "Retrouvez ces cinq étapes dans votre fiche ressource.", "notes": "11 min pour slides 15 à 18. L’écoute se voit par le respect du tour de parole et l’usage de la précision. Une suite concrète facultative peut suivre la vérification. On ne cherche pas à obtenir un oui à tout prix.", "answers": [], "kind": ""}, {"title": "Le prix : un exemple entièrement guidé", "block": "H1-F", "ref": "Ancien dossier face 8", "body": "<blockquote>« Elle me plaît, mais 200 €, c’est beaucoup pour une veste. »<\/blockquote><p class=\"big\">Quelle question poser avant de présenter un argument ?<\/p>", "task": "Proposez une reformulation et une question.", "notes": "Modéliser avec deux élèves volontaires ou deux voix. Révéler les étapes après tentative, pas avant. /40 du dossier ancien reste inchangé. Aujourd’hui grille formative /10 distincte.", "answers": [["Une reformulation fidèle", "<blockquote>« Vous hésitez devant le prix de cette veste. »<\/blockquote><p class=\"explain\">Je reprends le doute exprimé sans contredire et sans inventer sa cause.<\/p>"], ["Une question qui découvre", "<blockquote>« Qu’attendez-vous de cette veste pendant vos trajets ? »<\/blockquote><blockquote>« Je peux envisager ce prix si la protection contre la pluie correspond vraiment à mes trajets à pied. »<\/blockquote><p class=\"explain\">Je laisse le client répondre. Cette précision guide mon argument.<\/p>"]], "kind": ""}, {"title": "La construction de la réponse", "block": "H1-F", "ref": "Ancien dossier face 8, R1 verso", "body": "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Construction imperméable à trois couches.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Une protection contre la pluie pour vos trajets à pied.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La fiche du modèle 85241, repère F1, décrit cette construction selon H2No.<\/p><\/div><\/div><p class=\"explain\">Motivation confirmée : Sécurité.<br/>Indice : « la protection contre la pluie ».<\/p>", "task": "Rassemblez ces trois éléments dans une phrase naturelle.", "notes": "J’explique chaque couleur : bleu C, vert A, corail P. Le client a précisé son usage. La preuve vient du dossier. Éviter toute durée de vie ou économie inventée.", "answers": [["La réponse commerciale", "<blockquote>« Construction imperméable à trois couches. Une protection contre la pluie pour vos trajets à pied. La fiche du modèle 85241, repère F1, décrit cette construction selon H2No. »<\/blockquote><p class=\"explain\">La première phrase décrit le produit, la deuxième apporte le bénéfice, la troisième identifie la preuve.<\/p>"], ["La vérification et la suite", "<blockquote>« Cette protection répond-elle à votre attente pour vos trajets, ou reste-t-il un point à vérifier ? »<\/blockquote><blockquote>« Nous pouvons regarder ensemble la fiche et essayer la veste si vous le souhaitez. »<\/blockquote><p class=\"explain\">Je vérifie le doute traité et propose une suite facultative. Le client peut encore hésiter ou refuser.<\/p>"]], "kind": ""}, {"title": "Les deux autres réponses écrites", "block": "H1-F", "ref": "Ancien dossier faces 9 et 10", "body": "<div class=\"columns\"><div><h3>Face 9 : recyclé<\/h3><p>Le client attend une composition précise. Utilisez F2 et son périmètre.<\/p><\/div><div><h3>Face 10 : réparation<\/h3><p>Le client veut prolonger l’usage. Utilisez F7 et ses limites.<\/p><\/div><\/div>", "task": "Corrigez au moins une phrase de votre dossier.", "notes": "Corrections accessibles étape par étape. Je fais surtout expliciter la limite écologique et la condition de réparation. Une formulation différente est acceptable si elle remplit la fonction.", "answers": [["Face 9 : matière et preuve", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Le tissu extérieur est en nylon ECONYL 100 % recyclé.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Ce choix correspond à votre recherche de matière recyclée pour cette partie du vêtement.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La rubrique Matières de la fiche 85241 précise cette composition, F2.<\/p><\/div><\/div><blockquote>« La distinction entre tissu extérieur et ensemble de la veste répond-elle à votre doute ? »<\/blockquote><p class=\"explain\">Environnement. F2 concerne le tissu extérieur.<\/p>"], ["Face 10 : service et condition", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Patagonia propose des possibilités de réparation après examen.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Vous pouvez envisager de prolonger l’usage si le dommage est réparable.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La rubrique Réparations, résumée en F7, prévoit cet examen et précise que certains dommages ne sont pas réparables.<\/p><\/div><\/div><blockquote>« La possibilité de demander un examen pour réparation répond-elle à votre inquiétude ? »<\/blockquote><p class=\"explain\">Prolonger l’usage si le dommage est réparable. Environnement, ou Sécurité si justifié.<\/p>"]], "kind": ""}, {"title": "La répétition à deux", "block": "H1-G", "ref": "R1 recto et dossier corrigé", "body": "<ol class=\"steps\"><li>1 min : choisissez une objection et votre CAP.<\/li><li>2 min : le vendeur répond, le client apporte une précision.<\/li><li>2 min : échangez les rôles.<\/li><li>2 min : chacun améliore une phrase et la redit.<\/li><\/ol>", "task": "Vous pouvez regarder vos repères. Parlez sans lire un paragraphe entier.", "notes": "7 min. Au début fournir l’amorce « Vous hésitez parce que… Qu’est-ce qui… ». Je circule pour les élèves les plus fragiles. Les binômes restent assis. Pas de passage devant toute la classe.", "answers": [], "kind": ""}, {"title": "Les rôles dans votre triade", "block": "H2-A", "ref": "Cartes S1 à S3, grille G1", "body": "<div class=\"columns\"><div><h3>Vendeur<\/h3><p>Comprendre et répondre. Utiliser seulement R1 et la carte vendeur.<\/p><\/div><div><h3>Client<\/h3><p>Suivre la carte. Révéler la précision après une question pertinente.<\/p><\/div><div><h3>Observateur<\/h3><p>Noter une parole précise, puis un conseil utilisable.<\/p><\/div><\/div><p class=\"note\">Le client joue une hésitation crédible. Il cherche à aider l’apprentissage.<\/p>", "task": "Lisez uniquement votre rôle. Gardez la carte client confidentielle.", "notes": "5 min pour slides 20 à 22. Chaque triade a S1 S2 S3, les finales S4 S5 restent chez moi. Distribuer par rôle pour éviter lecture de la précision par le vendeur. Les premières situations reprennent volontairement les cas écrits pour sécuriser le transfert à l’oral.", "answers": [], "kind": ""}, {"title": "Les rotations : chacun devient vendeur", "block": "H2-A", "ref": "Conservez vos lettres A, B et C", "body": "<table><tr><th>Tour<\/th><th>Vendeur<\/th><th>Client<\/th><th>Observateur<\/th><\/tr><tr><td>1<\/td><td>A<\/td><td>B<\/td><td>C<\/td><\/tr><tr><td>2<\/td><td>B<\/td><td>C<\/td><td>A<\/td><\/tr><tr><td>3<\/td><td>C<\/td><td>A<\/td><td>B<\/td><\/tr><\/table><p class=\"intro\">Nous recommençons ces trois tours pour S1, puis S2, puis S3.<\/p><p class=\"note\">Un tour = 30 s de préparation, 90 s de dialogue, 60 s de feedback, 60 s de reprise.<\/p>", "task": "Après chaque tour, changez de rôle sans changer de groupe.", "notes": "Chaque situation prend 15 min : trois tours de 4 min + 3 min de correction commune. Chaque élève est vendeur trois fois, une fois dans chaque situation. Personne ne regarde un autre trio pendant que son groupe attend.", "answers": [], "kind": ""}, {"title": "La grille d’observation sur 10", "block": "H2-A", "ref": "G1 : une grille par vendeur", "body": "<table><tr><th>Critère<\/th><th>Maximum<\/th><\/tr><tr><td>Écoute et reformulation<\/td><td>1 + 1<\/td><\/tr><tr><td>Question utile et précision utilisée<\/td><td>2<\/td><\/tr><tr><td>C exacte, A personnalisé, P vérifiable<\/td><td>3<\/td><\/tr><tr><td>SONCASE, vérification, expression<\/td><td>1 + 1 + 1<\/td><\/tr><\/table><p class=\"big\">Une réussite précise. Un conseil. Un second essai.<\/p>", "task": "L’observateur écrit sur la grille du vendeur.", "notes": "La grille est formative, sans comparaison publique ni note automatique dans Pronote. CAP C1 A1 P1. Question : utile1, information obtenue utilisée1. Crédit partiel0,5 pour un attendu partiel. Les critères sont expliqués dans G1. Le client doit répondre selon la carte pour rendre l’observation valide.", "answers": [], "kind": ""}, {"title": "S1 : l’objection sur le prix", "block": "H2-B", "ref": "Carte S1, G1 colonne S1", "body": "<blockquote>« Elle me plaît, mais 200 €, c’est beaucoup pour une veste. »<\/blockquote><p class=\"intro\">Point de départ : le prix. Votre question doit faire préciser l’attente.<\/p><ol class=\"steps\"><li>Tour 1 : A vend.<\/li><li>Tour 2 : B vend.<\/li><li>Tour 3 : C vend.<\/li><\/ol>", "task": "Chaque tour dure 4 minutes. L’observateur demande une phrase améliorée.", "notes": "Ne pas révéler S1 correction avant les 3 tours. Je surveille question avant argument, F1 utilisé et absence de réduction inventée. À 12 min je passe à la correction commune de 3 min. Le minuteur continue sur le même bloc.", "answers": [], "kind": ""}, {"title": "S1 : une réponse expliquée", "block": "H2-B", "ref": "Carte S1, correction après les trois tours", "body": "<p class=\"big\">Le client confirme son attente de protection.<\/p><p class=\"intro\">La correction est une réponse possible. Une autre formulation peut convenir.<\/p>", "task": "Comparez une phrase de votre passage avec la réponse expliquée.", "notes": "3 min de recap. Ne pas repasser chaque intervention. Révéler R Q CAP V, expliquer Sécurité après précision, pas automatiquement Argent au seul mot prix.", "answers": [["Une reformulation fidèle", "<blockquote>« Vous hésitez devant le prix de cette veste. »<\/blockquote><p class=\"explain\">Je reprends le doute exprimé sans contredire et sans inventer sa cause.<\/p>"], ["Une question qui découvre", "<blockquote>« Qu’attendez-vous de cette veste pendant vos trajets ? »<\/blockquote><blockquote>« Je peux envisager ce prix si la protection contre la pluie correspond vraiment à mes trajets à pied. »<\/blockquote><p class=\"explain\">Je laisse le client répondre. Cette précision guide mon argument.<\/p>"], ["Le CAP et sa motivation", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Construction imperméable à trois couches.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Une protection contre la pluie pour vos trajets à pied.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La fiche du modèle 85241, repère F1, décrit cette construction selon H2No.<\/p><\/div><\/div><p class=\"explain\"><b>SONCASE : Sécurité.<\/b> Le prix est l’objection de départ. La réponse recueillie fait apparaître une priorité de protection. Sécurité domine après cette précision. Argent reste défendable si le lien prix-utilité est expliqué.<\/p>"], ["La réponse commerciale", "<blockquote>« Construction imperméable à trois couches. Une protection contre la pluie pour vos trajets à pied. La fiche du modèle 85241, repère F1, décrit cette construction selon H2No. »<\/blockquote><p class=\"explain\">La première phrase décrit le produit, la deuxième apporte le bénéfice, la troisième identifie la preuve.<\/p>"], ["La vérification et la suite", "<blockquote>« Cette protection répond-elle à votre attente pour vos trajets, ou reste-t-il un point à vérifier ? »<\/blockquote><blockquote>« Nous pouvons regarder ensemble la fiche et essayer la veste si vous le souhaitez. »<\/blockquote><p class=\"explain\">Je vérifie le doute traité et propose une suite facultative. Le client peut encore hésiter ou refuser.<\/p>"]], "kind": ""}, {"title": "S2 : le doute sur le recyclé", "block": "H2-C", "ref": "Carte S2, G1 colonne S2", "body": "<blockquote>« Vous dites recyclé, mais est-ce vraiment toute la veste ? Je me méfie des promesses écologiques. »<\/blockquote><p class=\"intro\">Votre défi : répondre avec une preuve dont vous précisez le périmètre.<\/p><p class=\"big\">Trois tours de 4 minutes. A, puis B, puis C vendent.<\/p>", "task": "Le vendeur peut consulter F2. Le client attend une information précise.", "notes": "Je surveille le périmètre du pourcentage. Pas d’affirmation impact nul, plus écologique que tous les concurrents ni veste intégralement recyclée. 12 min tours, 3 min correction.", "answers": [], "kind": ""}, {"title": "S2 : une réponse expliquée", "block": "H2-C", "ref": "Carte S2, correction après les trois tours", "body": "<p class=\"big\">Le client souhaite choisir une matière recyclée en connaissance de cause.<\/p>", "task": "Améliorez une affirmation trop générale.", "notes": "La couleur P identifie le document et le périmètre. Accepter une autre phrase fidèle au corpus.", "answers": [["Une reformulation fidèle", "<blockquote>« Vous voulez savoir quelle partie est recyclée et éviter une promesse trop générale. »<\/blockquote><p class=\"explain\">Je reprends le doute exprimé sans contredire et sans inventer sa cause.<\/p>"], ["Une question qui découvre", "<blockquote>« Quelles précisions sur les matières vous aideraient à choisir ? »<\/blockquote><blockquote>« Je privilégie la matière recyclée, mais je veux savoir exactement quelle partie est concernée. »<\/blockquote><p class=\"explain\">Je laisse le client répondre. Cette précision guide mon argument.<\/p>"], ["Le CAP et sa motivation", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Le tissu extérieur est en nylon ECONYL 100 % recyclé.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Ce choix correspond à votre recherche de matière recyclée pour cette partie du vêtement.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La rubrique Matières de la fiche 85241 précise cette composition, F2.<\/p><\/div><\/div><p class=\"explain\"><b>SONCASE : Environnement.<\/b> Le client donne un critère environnemental explicite. La preuve doit préciser son périmètre. On ne promet ni une veste entièrement recyclée, ni un impact nul.<\/p>"], ["La réponse commerciale", "<blockquote>« Le tissu extérieur est en nylon ECONYL 100 % recyclé. Ce choix correspond à votre recherche de matière recyclée pour cette partie du vêtement. La rubrique Matières de la fiche 85241 précise cette composition, F2. »<\/blockquote><p class=\"explain\">La première phrase décrit le produit, la deuxième apporte le bénéfice, la troisième identifie la preuve.<\/p>"], ["La vérification et la suite", "<blockquote>« La distinction entre tissu extérieur et ensemble de la veste répond-elle à votre doute ? »<\/blockquote><blockquote>« Nous pouvons relire ensemble la composition du modèle. »<\/blockquote><p class=\"explain\">Je vérifie le doute traité et propose une suite facultative. Le client peut encore hésiter ou refuser.<\/p>"]], "kind": ""}, {"title": "S3 : la réparation", "block": "H2-D", "ref": "Carte S3, G1 colonne S3", "body": "<blockquote>« Et si elle s’abîme ? Je ne voudrais pas la jeter à la première déchirure. »<\/blockquote><p class=\"intro\">Votre défi : présenter une possibilité sans promettre le résultat de l’examen.<\/p><p class=\"big\">Trois tours de 4 minutes. A, puis B, puis C vendent.<\/p>", "task": "Le vendeur peut consulter F7. Posez une question avant le CAP.", "notes": "Je surveille les promesses tout réparable, gratuit, garanti à vie, délai fixe. Toutes dépassent ce corpus. 12 min tours, 3 min correction.", "answers": [], "kind": ""}, {"title": "S3 : une réponse expliquée", "block": "H2-D", "ref": "Carte S3, correction après les trois tours", "body": "<p class=\"big\">Le client souhaite prolonger l’usage du vêtement.<\/p>", "task": "Précisez la condition dans votre phrase.", "notes": "J’accepte Environnement avec indice prolonger, et Sécurité avec raisonnement explicite. Aucun bonus pour une promesse rassurante mais fausse.", "answers": [["Une reformulation fidèle", "<blockquote>« Vous souhaitez connaître les solutions pour éviter de jeter immédiatement une veste abîmée. »<\/blockquote><p class=\"explain\">Je reprends le doute exprimé sans contredire et sans inventer sa cause.<\/p>"], ["Une question qui découvre", "<blockquote>« Que souhaiteriez-vous pouvoir faire si votre vêtement était endommagé ? »<\/blockquote><blockquote>« Ce qui compte pour moi, c’est de prolonger l’usage de mon vêtement plutôt que d’en racheter tout de suite un autre. »<\/blockquote><p class=\"explain\">Je laisse le client répondre. Cette précision guide mon argument.<\/p>"], ["Le CAP et sa motivation", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Patagonia propose des possibilités de réparation après examen.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Vous pouvez envisager de prolonger l’usage si le dommage est réparable.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La rubrique Réparations, résumée en F7, prévoit cet examen et précise que certains dommages ne sont pas réparables.<\/p><\/div><\/div><p class=\"explain\"><b>SONCASE : Environnement.<\/b> La priorité exprimée est de prolonger l’usage. Environnement est cohérent. Sécurité est recevable si l’élève explique la recherche d’une solution rassurante. Le résultat de l’examen, le délai et le coût ne figurent pas dans le dossier.<\/p>"], ["La réponse commerciale", "<blockquote>« Patagonia propose des possibilités de réparation après examen. Vous pouvez envisager de prolonger l’usage si le dommage est réparable. La rubrique Réparations, résumée en F7, prévoit cet examen et précise que certains dommages ne sont pas réparables. »<\/blockquote><p class=\"explain\">La première phrase décrit le produit, la deuxième apporte le bénéfice, la troisième identifie la preuve.<\/p>"], ["La vérification et la suite", "<blockquote>« La possibilité de demander un examen pour réparation répond-elle à votre inquiétude ? »<\/blockquote><blockquote>« Je peux vous montrer où trouver les informations sur une demande de réparation. »<\/blockquote><p class=\"explain\">Je vérifie le doute traité et propose une suite facultative. Le client peut encore hésiter ou refuser.<\/p>"]], "kind": ""}, {"title": "Votre progrès avant la coupure", "block": "H2-E", "ref": "G1, commentaires", "body": "<ol class=\"steps\"><li>Relisez les trois colonnes de votre grille.<\/li><li>Choisissez une réussite et un point à améliorer.<\/li><li>Écrivez une phrase que vous voulez mieux dire au retour.<\/li><\/ol>", "task": "Gardez la grille et R1. Remettez les cartes client.", "notes": "5 min puis 5 min marge de sortie. Je récupère les cartes S1-S3 et garde S4/S5 cachées. Je relève les élèves qui ont besoin d’un guidage, sans les nommer devant le groupe. Aucun classement public.", "answers": [], "kind": ""}, {"title": "La reprise silencieuse", "block": "H3-A", "ref": "R1 et G1", "body": "<ol class=\"steps\"><li>Relisez votre objectif.<\/li><li>Réécrivez une question de découverte utile.<\/li><li>Vérifiez la preuve de votre CAP dans R1.<\/li><\/ol>", "task": "5 minutes, seul. Vous préparez votre prochain passage.", "notes": "Accueil après coupure. La consigne est affichée avant l’entrée. Ne pas ouvrir les cartes finales maintenant. Je fais préciser un seul objectif à chaque élève, par exemple questionner avant argumenter.", "answers": [], "kind": ""}, {"title": "L’objection « C’est trop cher »", "block": "H3-B", "ref": "Observation ciblée", "body": "<p class=\"intro\"><a class=\"video\" href=\"https://www.youtube.com/watch?v=w54gC1qpqn0&t=84s\" target=\"_blank\" rel=\"noopener\">Ouvrir l’extrait sur le prix<\/a><\/p><p class=\"big\">De 1 min 24 à 4 min 59.<\/p><p class=\"intro\">Quelle question permet de comprendre ce qui se cache derrière le prix ?<\/p>", "task": "Notez une question, puis adaptez-la à notre veste.", "notes": "6 min : 3 min35 extrait, 2 min25 analyse (slide suivante). Vidéo B2B, pas une scène de magasin : sélectionner l’exploration du frein et éviter la transposition de techniques de pression. Si blocage, lire le dialogue prix modélisé en H1. La proposition pédagogique ne dépend pas de la connexion.", "answers": [], "kind": ""}, {"title": "La transposition en magasin", "block": "H3-B", "ref": "Fiche R1", "body": "<blockquote>« Le prix vous fait hésiter. Qu’est-ce qui vous permettrait de juger si cette veste correspond à votre usage ? »<\/blockquote><p class=\"intro\">La réponse du client peut préciser le budget, la protection attendue ou l’utilité réelle.<\/p><p class=\"big\">Je vérifie. Je ne suppose pas.<\/p>", "task": "Proposez un CAP seulement après une précision du client.", "notes": "Je ne réduis pas toutes les objections à un manque de perception de valeur. Un budget peut être réellement non négociable. Respecter le refus. Correction : question ouverte permet de découvrir, CAP ensuite adapté à l’information obtenue.", "answers": [], "kind": ""}, {"title": "L’entretien final", "block": "H3-C", "ref": "Cartes S4 ou S5, G1 colonne Final", "body": "<ol class=\"steps\"><li>3 min : le vendeur prépare avec R1, sans voir la carte client.<\/li><li>4 min : entretien avec une objection inattendue.<\/li><li>2 min : observation et un conseil ciblé.<\/li><li>2 min : réponse améliorée.<\/li><li>1 min : changement de rôles.<\/li><\/ol>", "task": "Trois tours de 12 minutes. Chacun passe vendeur une fois.", "notes": "36 min. Je choisis S4 ou S5, attribuées secrètement au client. Tour 1 A vendeur, tour 2 B, tour 3 C. Pour l’équité, proposer une difficulté similaire et signaler l’aide utilisée. Cartes S4/S5 peuvent alterner. Les vendeurs savent que chaque précision doit être découverte. Je note moi-même les passages si comptabilisation envisagée. Le retour des pairs reste formatif.", "answers": [], "kind": ""}, {"title": "Les aides et les critères du passage final", "block": "H3-C", "ref": "R1 et G1", "body": "<div class=\"columns\"><div><h3>Aide commune<\/h3><p>La fiche produit reste ouverte pour tous.<\/p><\/div><div><h3>Aide de méthode<\/h3><p>Les cinq étapes sont disponibles. Vous rédigez quelques mots, pas un dialogue complet.<\/p><\/div><div><h3>Objectif<\/h3><p>Une réponse adaptée, précise et respectueuse.<\/p><\/div><\/div><p class=\"note\">L’observateur note des faits. Il n’évalue ni la personnalité ni l’assurance apparente.<\/p>", "task": "Si vous bloquez, revenez à une question sur l’usage ou l’hésitation.", "notes": "Différenciation : fragile = amorces, intermédiaire = cinq étapes, autonome = fiche produit seule si volontaire. Même grille, noter l’aide utilisée. Ne pas comparer les scores de niveaux d’aide différents sans précaution. Le professeur arbitre si note sommative, annoncer avant. Pas de pénalité du bégaiement, accent, handicap ni contact visuel imposé.", "answers": [], "kind": ""}, {"title": "Les réponses possibles du passage final", "block": "H3-D", "ref": "Après tous les passages", "body": "<p class=\"big\">Deux situations, deux arguments adaptés.<\/p><p class=\"intro\">La bonne réponse dépend de l’information que votre question a fait apparaître.<\/p>", "task": "Comparez votre argument à la correction de votre situation.", "notes": "Sur les 8 min bilan : 3 min corrections S4/S5, 4 min fiche B1, 1 min conclusion. Ne pas montrer avant fin des trois tours.", "answers": [["S4 : chaleur, question et motivation", "<blockquote>« Vous hésitez parce que votre précédente veste technique vous a peu servi. »<\/blockquote><blockquote>« Qu’est-ce qui vous gênait dans l’utilisation de votre ancienne veste ? »<\/blockquote><blockquote>« Quand je marche vite, j’ai trop chaud. Je voudrais pouvoir ajuster l’aération sans retirer ma veste. »<\/blockquote><p class=\"explain\">Confort : le client décrit une gêne à l’usage.<\/p>"], ["S4 : CAP et vérification", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>Des zips de ventilation se trouvent sous les bras.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Vous pouvez ajuster l’aération lorsque vous marchez vite.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La fiche du modèle mentionne ces zips en F4.<\/p><\/div><\/div><blockquote>« Cette possibilité d’aération répond-elle à la gêne que vous avez décrite ? »<\/blockquote><p class=\"explain\">L’aération peut se régler. On ne promet pas une absence totale de chaleur.<\/p>"], ["S5 : utilité, question et motivation", "<blockquote>« Vous voulez vérifier que les fonctions de cette veste correspondent à votre usage. »<\/blockquote><blockquote>« Qu’est-ce qui vous serait vraiment utile au quotidien ? »<\/blockquote><blockquote>« Je veux surtout la ranger facilement dans mon sac quand je ne la porte pas. J’ai peu de place. »<\/blockquote><p class=\"explain\">Confort : praticité et rangement.<\/p>"], ["S5 : CAP et vérification", "<div class=\"cap\"><div class=\"c\"><b>C<\/b><h3>Caractéristique<\/h3><p>La veste se range dans sa poche gauche.<\/p><\/div><div class=\"a\"><b>A<\/b><h3>Avantage<\/h3><p>Vous pouvez la regrouper pour la ranger lorsque vous ne la portez pas.<\/p><\/div><div class=\"p\"><b>P<\/b><h3>Preuve<\/h3><p>La rubrique Poches de la fiche confirme le rangement dans la poche gauche, F5.<\/p><\/div><\/div><blockquote>« Cette possibilité de rangement correspond-elle à votre besoin, ou souhaitez-vous vérifier l’encombrement ? »<\/blockquote><p class=\"explain\">Proposer de vérifier l’encombrement, sans promettre une dimension inconnue.<\/p>"]], "kind": ""}, {"title": "Votre bilan individuel", "block": "H3-D", "ref": "B1 : une fiche par élève", "body": "<ol class=\"steps\"><li>Une réussite avec un exemple précis.<\/li><li>Une question de découverte et un CAP à réutiliser.<\/li><li>Un objectif observable pour le prochain entretien.<\/li><\/ol>", "task": "Complétez B1 seul, en 4 minutes.", "notes": "Je collecte B1 et G1 pour le suivi de séance. Un objectif vague « mieux vendre » devient « poser une question avant le CAP ». Les élèves peuvent garder R1.", "answers": [], "kind": ""}, {"title": "Vos cinq repères", "block": "H3-D", "ref": "R1 recto", "body": "<ol class=\"steps\"><li>Écouter les paroles, sans supposer la motivation.<\/li><li>Reformuler ce qui fait hésiter.<\/li><li>Poser une question et utiliser sa réponse.<\/li><li>Relier C, A et P à la motivation identifiée.<\/li><li>Vérifier le doute et respecter la décision.<\/li><\/ol>", "task": "Dites la prochaine action que vous allez améliorer.", "notes": "Synthèse orale courte. Chaque progrès est observable. Un refus du client n’est pas automatiquement un échec du vendeur. La réussite pédagogique est la qualité de l’écoute et de la réponse.", "answers": [], "kind": ""}, {"title": "Merci pour votre implication<br/>et la qualité de votre travail", "block": "H3-D", "ref": "Fin de séance", "body": "<p class=\"hero\">Vous avez essayé.<br/>Vous avez reçu un retour.<br/>Vous avez amélioré une réponse.<\/p><p class=\"intro\">Votre prochain objectif : utiliser ces repères dans une nouvelle situation.<\/p>", "task": "Remettez G1 et B1. Conservez R1 dans votre dossier de cours.", "notes": "Clôture. Pas de prochain rendez-vous inventé. Vérifier collecte de toutes les grilles, même pour un passage interrompu. 5 minutes de marge par heure restent disponibles.", "answers": [], "kind": "cover"}], "blocks": {"H1-A": {"id": "H1-A", "hour": "H1", "name": "Accueil et mission", "minutes": 5}, "H1-B": {"id": "H1-B", "hour": "H1", "name": "Correction ciblée", "minutes": 12}, "H1-C": {"id": "H1-C", "hour": "H1", "name": "CAP et SONCASE", "minutes": 4}, "H1-D": {"id": "H1-D", "hour": "H1", "name": "Comparaison vidéo", "minutes": 12}, "H1-E": {"id": "H1-E", "hour": "H1", "name": "Extrait CAP", "minutes": 4}, "H1-F": {"id": "H1-F", "hour": "H1", "name": "Modélisation", "minutes": 11}, "H1-G": {"id": "H1-G", "hour": "H1", "name": "Répétition à deux", "minutes": 7}, "H2-A": {"id": "H2-A", "hour": "H2", "name": "Organisation", "minutes": 5}, "H2-B": {"id": "H2-B", "hour": "H2", "name": "Situation 1", "minutes": 15}, "H2-C": {"id": "H2-C", "hour": "H2", "name": "Situation 2", "minutes": 15}, "H2-D": {"id": "H2-D", "hour": "H2", "name": "Situation 3", "minutes": 15}, "H2-E": {"id": "H2-E", "hour": "H2", "name": "Bilan", "minutes": 5}, "H3-A": {"id": "H3-A", "hour": "H3", "name": "Reprise silencieuse", "minutes": 5}, "H3-B": {"id": "H3-B", "hour": "H3", "name": "Objection prix et analyse", "minutes": 6}, "H3-C": {"id": "H3-C", "hour": "H3", "name": "Entretien final", "minutes": 36}, "H3-D": {"id": "H3-D", "hour": "H3", "name": "Bilan individuel", "minutes": 8}}, "videos": [["Mauvais vendeur en produits biologiques", "CFA du CIFCA", "https://www.youtube.com/watch?v=iNln8II5wOY"], ["Bon vendeur en produits biologiques", "CFA du CIFCA", "https://www.youtube.com/watch?v=7l2u05x3QUM"], ["CAP SONCASE : exemple de tableau", "Technique de Vente Edition", "https://www.youtube.com/watch?v=NLeYojG5U-I&t=108s"], ["Six objections courantes", "Quentin Despas / The Good Sales", "https://www.youtube.com/watch?v=w54gC1qpqn0&t=84s"]]},slides=data.slides,$=id=>document.getElementById(id);let index=0,answer=-1,running=false,endTime=0,lastFocus=null;const timeState={};Object.values(data.blocks).forEach(b=>timeState[b.id]=b.minutes*60);function block(){return data.blocks[slides[index].block]}function scale(){document.querySelector('.deck').style.transform='scale('+Math.min(innerWidth/1600,(innerHeight-64)/900)+')'}function pause(){if(running)timeState[block().id]=Math.max(0,Math.ceil((endTime-Date.now())/1000));running=false;clock()}function clock(){let t=timeState[block().id];$('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');$('clock').classList.toggle('done',t===0);$('timer').textContent=running?'Ⅱ Pause':'▶ Temps'}function start(){if(running)return pause();let b=block();if(timeState[b.id]===0)timeState[b.id]=b.minutes*60;endTime=Date.now()+timeState[b.id]*1000;running=true;clock()}setInterval(()=>{if(running){timeState[block().id]=Math.max(0,Math.ceil((endTime-Date.now())/1000));if(!timeState[block().id])running=false;clock()}},200);
function render(){let s=slides[index],b=block(),a=answer>=0?s.answers[answer]:null;$('content').className='content motion '+s.kind;$('content').innerHTML='<div class="top"><b>'+b.hour.replace('H','HEURE ')+'</b><span>'+b.name+'</span><span class="timing">Bloc '+b.minutes+' min</span></div><h1>'+(a?a[0]:s.title)+'</h1><div class="body">'+(a?a[1]:s.body)+'</div><div class="task"><strong>'+(a?'À retenir':'À faire')+'</strong>'+(a?'Comparez avec votre réponse. Les formulations proposées sont des exemples recevables.':s.task)+'</div><footer class="footer"><span>A.Zeboudj</span><span>'+s.ref+(a?' · Correction '+(answer+1)+'/'+s.answers.length:'')+'</span><span>'+String(index+1).padStart(2,'0')+' / '+slides.length+'</span></footer>';$('jump').value=index;$('correct').disabled=!s.answers.length;$('correct').textContent=answer<0?'Correction':'Retour au travail';$('answerNext').hidden=answer<0;$('answerNext').textContent=answer<s.answers.length-1?'Suite de la correction':'Fin de la correction';$('prev').disabled=index===0&&answer<0;$('next').disabled=index===slides.length-1&&answer<0;window.scrollTo(0,0);$('progress').style.width=((index+1)/slides.length*100)+'%';clock()}
function go(n){pause();index=Math.max(0,Math.min(slides.length-1,n));answer=-1;render()}function setAnswer(n){pause();answer=n;render()}function toggle(){if(slides[index].answers.length)setAnswer(answer<0?0:-1)}function forward(){if(answer>=0)setAnswer(answer<slides[index].answers.length-1?answer+1:-1);else go(index+1)}function back(){if(answer>=0)setAnswer(answer-1);else go(index-1)}function show(title,body){pause();lastFocus=document.activeElement;$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').classList.add('open');$('close').focus()}function close(){$('dialog').classList.remove('open');if(lastFocus)lastFocus.focus()}$('jump').innerHTML=slides.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s.title.replace(/<br\s*\/?>/g,' ')+'</option>').join('');$('jump').onchange=e=>go(Number(e.target.value));$('prev').onclick=back;$('next').onclick=forward;$('correct').onclick=toggle;$('answerNext').onclick=forward;$('timer').onclick=start;$('reset').onclick=()=>{pause();timeState[block().id]=block().minutes*60;clock()};$('notes').onclick=()=>show('Notes enseignant, écran '+(index+1),'<p>'+slides[index].notes+'</p><p><b>Attention :</b> cette fenêtre apparaît sur la projection. Le conducteur PDF reprend les informations utiles.</p>');$('help').onclick=()=>show('Mode d’emploi','<p>Ouvrez le HTML téléchargé dans Chrome. Tout le support fonctionne hors connexion, sauf YouTube et les liens sources.</p><p>Flèches : changer d’écran. C : correction. Espace : suite de correction ou minuteur. V : accès aux quatre vidéos. N : notes enseignant visibles à la projection. F : plein écran. B : écran noir. Échap : fermer.</p><p>Le minuteur appartient au bloc de travail. Les écrans et corrections du même bloc gardent le temps restant. Une navigation met en pause. Rien ne change d’écran automatiquement. La durée totale des blocs est de 55 minutes par heure, plus 5 minutes de marge.</p><p>Les vidéos CIFCA doivent être testées avant la séance. Les dialogues fictifs de secours se trouvent dans les corrections des écrans vidéo et dans le conducteur. Les critères proposés ne sont pas une transcription vérifiée des vidéos.</p>');$('close').onclick=close;$('dialog').onclick=e=>{if(e.target===$('dialog'))close()};$('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){show('Plein écran','Utilisez le menu plein écran de votre navigateur.')}};addEventListener('keydown',e=>{if(['SELECT','INPUT'].includes(e.target.tagName))return;let k=e.key.toLowerCase();if($('dialog').classList.contains('open')){if(k==='escape')close();return}if(k==='v'&&!document.body.classList.contains('blackout')){showVideos();return}if(k==='b'){document.body.classList.toggle('blackout');return}if(document.body.classList.contains('blackout')){if(k==='escape')document.body.classList.remove('blackout');return}if(['arrowright','arrowleft',' ','pagedown','pageup'].includes(k))e.preventDefault();if(k==='arrowright')forward();if(k==='arrowleft')back();if(k==='pagedown')go(index+1);if(k==='pageup')go(index-1);if(k==='c')toggle();if(k===' ')answer>=0?forward():start();if(k==='n')$('notes').click();if(k==='f')$('full').click();if(k==='escape'&&answer>=0)setAnswer(-1)});
